[project]
name = "logits-masking-explorer"
version = "0.1.0"
description = "Interactive Streamlit app for learning how logits masking steers LLM generation"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "streamlit>=1.40",
    "torch>=2.5",
    "transformers>=4.46",
    "pandas>=2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
